<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>مصطلحات الموارد البشرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: navy hero band with the small logo on top, four section tabs, then a grid of term cards.
   Each card = speaker + English term + Arabic meaning, then an example box with its own speaker. */
:root {
  --bg: #FAF7F0;
  --surface: #FFFDF8;
  --sand: #F0E6D2;
  --line: #E2D6BE;
  --ink: #14284B;
  --muted: #5C6985;
  --hero: #FFFFFF;
  --hero-ink: #14284B;
  --hero-soft: #5C6985;
  --btn: #14284B;
  --btn-ink: #FAF7F0;
  --chip: #FAF7F0;
  --focus: #2E5BB8;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.hero {
  background: var(--hero);
  color: var(--hero-ink);
  border-bottom: 4px solid var(--ink);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: 36px;
}
.hero-in { max-width: 1080px; margin-inline: auto; }
.brand {
  display: inline-flex;
  background: transparent;
  padding: 0;
}
.brand img { display: block; height: 40px; width: auto; max-width: 100%; }
.eyebrow {
  margin: 28px 0 4px;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  color: var(--hero-soft);
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2rem, 7vw, 3.2rem);
  line-height: 1.25;
  text-wrap: balance;
}
.lead { margin: 12px 0 0; max-width: 56ch; color: var(--hero-soft); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 18px; font-size: 0.92rem; color: var(--hero-soft); font-variant-numeric: tabular-nums; }
.stats b { color: var(--hero-ink); font-weight: 600; }

main { max-width: 1080px; margin-inline: auto; }

.tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: -22px;
  position: relative;
}
.tab {
  text-align: right;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  cursor: pointer;
  display: grid;
  gap: 2px;
  min-width: 0;
  transition: background .15s, border-color .15s;
}
.tab:hover { border-color: var(--ink); }
.tab .n { font-family: var(--font-display); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab .en { direction: ltr; text-align: right; font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; line-height: 1.3; overflow-wrap: anywhere; }
.tab .ar { font-size: 0.85rem; color: var(--muted); }
.tab .c { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--btn); border-color: var(--btn); }
.tab[aria-selected="true"] .n, .tab[aria-selected="true"] .ar, .tab[aria-selected="true"] .c { color: var(--btn-ink); opacity: .8; }
.tab[aria-selected="true"] .en { color: var(--btn-ink); }
@media (max-width: 820px) {
  .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px 16px; margin: 28px 0 16px;
}
.sec-title { margin: 0; min-width: 0; }
.sec-title .en { display: block; direction: ltr; text-align: right; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.3; }
.sec-title .ar { color: var(--muted); font-size: 0.95rem; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.search {
  width: min(100%, 260px);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 16px;
}
.search::placeholder { color: var(--muted); opacity: 1; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.92rem; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.track::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + .track { background: var(--btn); }
.switch input:checked + .track::after { transform: translateX(-16px); background: var(--btn-ink); }
.switch input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }

.notice {
  background: var(--sand); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px; margin-bottom: 16px; font-size: 0.92rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
  gap: 14px;
  padding: 0; margin: 0; list-style: none;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  display: grid;
  gap: 14px;
  min-width: 0;
  align-content: start;
}
.term { display: flex; align-items: center; gap: 12px; min-width: 0; }
.idx {
  flex: none; align-self: flex-start;
  min-width: 26px; height: 26px; padding-inline: 6px;
  border-radius: 8px; background: var(--sand);
  font-size: 0.78rem; font-weight: 600; color: var(--muted);
  display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.words { min-width: 0; flex: 1; }
.words .en {
  display: block; direction: ltr; text-align: right;
  font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; line-height: 1.3;
  overflow-wrap: anywhere;
}
.words .ar { display: block; margin-top: 2px; color: var(--muted); font-size: 1.05rem; }
.words .ar small { color: var(--muted); font-size: 0.78rem; margin-inline-end: 6px; letter-spacing: .02em; }

.spk {
  flex: none;
  width: 46px; height: 46px; border-radius: 50%;
  border: 0; cursor: pointer;
  background: var(--btn); color: var(--btn-ink);
  display: grid; place-items: center;
  transition: transform .1s;
}
.spk:active { transform: scale(.94); }
.spk svg { width: 22px; height: 22px; display: block; }
.spk.sm { width: 36px; height: 36px; background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.spk.sm svg { width: 18px; height: 18px; }
.spk.playing { animation: ring 1s ease-out infinite; }
@keyframes ring {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--focus) 55%, transparent); }
  100% { box-shadow: 0 0 0 12px transparent; }
}
.spk:disabled { opacity: .4; cursor: not-allowed; }

.ex { background: var(--sand); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.ex-txt { min-width: 0; flex: 1; }
.ex-lab { display: block; font-size: 0.75rem; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px; }
.ex .en { display: block; direction: ltr; text-align: right; font-size: 1rem; line-height: 1.5; overflow-wrap: anywhere; }
.ex .ar { display: block; margin-top: 4px; color: var(--muted); font-size: 0.95rem; }

.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.foot { margin-top: 36px; text-align: center; color: var(--muted); font-size: 0.85rem; }

@media (prefers-reduced-motion: reduce) {
  .spk.playing { animation: none; outline: 3px solid var(--focus); outline-offset: 2px; }
  * { transition: none !important; }
}
</style>
</head>

</header>

<main>

    <p class="empty" id="empty" hidden>ما فيه نتائج مطابقة.</p>
  </section>

</main>

<script>

    ["Games-Based Training", "التدريب القائم على الألعاب", "Games-based training increased engagement.", "التدريب القائم على الألعاب زاد التفاعل."],
    ["Job Rotation", "التناوب الوظيفي", "Job rotation allows work in departments.", "التناوب الوظيفي يتيح العمل في عدة أقسام."],
    ["Lecture", "المحاضرة", "Lecture covered strategic planning.", "المحاضرة تناولت أهمية التخطيط."],
    ["Mentoring", "الإرشاد", "Mentoring focuses on skill development.", "الإرشاد يركز على تطوير المهارات."],
    ["Delivery mode", "وضع التوصيل", "Delivery mode chosen as online.", "تم اختيار وضع التوصيل عن بعد."],
    ["On-the-job coaching", "التدريب على رأس العمل", "On-the-job coaching gave hands-on experience.", "التدريب على رأس العمل أعطى خبرة مباشرة."],
    ["Technical training", "التدريب التقني", "Joined technical training program.", "التحق ببرنامج التدريب التقني."],
    ["Skills training", "التدريب على المهارات", "Skills training workshop held.", "عُقدت ورشة للتدريب على المهارات."],
    ["Managerial training", "التدريب الإداري", "Enrolled in managerial training.", "التحق ببرنامج التدريب الإداري."],
    ["Safety training", "تدريب بالسلامة", "Completed safety training.", "أكمل تدريب السلامة قبل العمل."],
    ["Role-Play", "لعب الأدوار", "Role-play to simulate service.", "لعب الأدوار لمحاكاة خدمة العملاء."],
    ["Simulation", "المحاكاة", "Simulation provided realistic environment.", "المحاكاة وفرت بيئة واقعية للتدريب."],
    ["Group Discussions", "مجموعة النقاشات", "Group discussions to share insights.", "مجموعة النقاشات لتبادل الخبرات."],
    ["Conferences", "المؤتمرات", "Attended conferences.", "حضرنا المؤتمرات للاطلاع على الجديد."],
    ["Brainstorming", "العصف الذهني", "Brainstorming generated ideas.", "جلسة العصف الذهني ولدت أفكارًا."],
    ["Budget", "ميزانية", "Budget of 50,000 approved.", "تم اعتماد ميزانية 50 ألف للبرنامج."],
    ["Audience", "جمهور", "Audience engaged with content.", "الجمهور كان متفاعلًا مع المحتوى."],
    ["Content", "محتوى", "Content developed for beginners.", "تم تطوير محتوى للمبتدئين."],
    ["Timeline", "الجداول الزمنية", "Timeline ensures delivery.", "الجداول الزمنية أُعدت لضمان التسليم."],
    ["Communication", "تواصل", "Effective communication is key.", "التواصل الفعال أساس نجاح العمل."],
    ["Training effectiveness", "قياس فعالية المتدرب", "Training effectiveness measured by survey.", "قيّست فعالية المتدرب عبر استبيان."],
    ["Needs Assessment", "تقييم الاحتياجات", "Needs assessment conducted.", "أُجري تقييم الاحتياجات قبل البرنامج."],
    ["Quality of life training", "تدريب على جودة الحياة", "Quality of life training helps balance.", "تدريب جودة الحياة يساعد على التوازن."]
  ]},
  { id: "s3", n: 3, en: "Training evaluation", ar: "تقييم التدريب", items: [
    ["Training evaluation", "تقييم التدريب", "Training evaluation is the systematic process of analyzing training programs.", "تقييم التدريب هو عملية منهجية لتحليل البرامج التدريبية."],
    ["Definition", "التعريف", "Trainers use training evaluation to assess programs.", "يستخدم المدربون تقييم التدريب لتقييم البرامج."],
    ["The Kirkpatrick Model", "نموذج كيركباتريك", "The Kirkpatrick Model has four levels to evaluate training.", "نموذج كيركباتريك يحتوي على أربعة مستويات لتقييم التدريب."],
    ["Level 1 Reaction", "المستوى الأول: رد الفعل", "Are the participants satisfied with the program?", "هل المشاركون راضون عن البرنامج؟"],
    ["Short survey", "استطلاع قصير", "We conducted a short survey after the course.", "أجرينا استطلاعًا قصيرًا بعد الدورة."],
    ["Feedback forms", "نماذج التغذية الراجعة", "Please fill out the feedback forms.", "يرجى تعبئة نماذج التغذية الراجعة."],
    ["Level 2 Learning", "المستوى الثاني: التعلم", "What did the participants learn from the training?", "ماذا تعلم المشاركون عن التدريب؟"],
    ["Practical tests", "اختبارات عملية", "Practical tests show real skills.", "الاختبارات العملية تظهر المهارات الحقيقية."],
    ["Short quizzes", "اختبارات قصيرة", "Short quizzes before and after training measure progress.", "الاختبارات القصيرة قبل وبعد التدريب تقيس التقدم."],
    ["Level 3 Behavior", "المستوى الثالث: السلوك", "Did the participants change their behavior as a result?", "هل غير المشاركون سلوكهم نتيجة التدريب؟"],
    ["Supervisor evaluation", "تقييم المشرف", "Supervisor evaluation shows behavior change at work.", "تقييم المشرف يظهر تغير السلوك في العمل."],
    ["Self-assessment", "التقييم الذاتي", "Self-assessment helps employees reflect.", "التقييم الذاتي يساعد الموظفين على التأمل."],
    ["Level 4 Results", "المستوى الرابع: النتائج", "Does the change affect the organization?", "هل يؤثر التغيير على المنظمة؟"],
    ["Course", "دورة", "The effectiveness of any training course or program.", "فعالية أي دورة تدريبية أو برنامج."],
    ["Expected return", "العائد المتوقع", "Expected return shows positive effect on company.", "العائد المتوقع يظهر الأثر الإيجابي على الشركة."]
  ]},
  { id: "s4", n: 4, en: "Investment return", ar: "عائد الاستثمار", items: [
    ["Training provider costs", "تكاليف مزود التدريب", "Training provider costs are reviewed every month.", "تتم مراجعة تكاليف مزود التدريب كل شهر."],
    ["Cost per course", "التكلفة لكل دورة", "The manager approved the cost per course.", "وافق المدير على التكلفة لكل دورة."],
    ["Numbers of people trained", "عدد الأشخاص الذين تم تدريبهم", "Numbers of people trained are important for evaluation.", "عدد الأشخاص الذين تم تدريبهم مهم للتقييم."],
    ["Investment return", "عائد الاستثمار", "Investment return is high due to good training.", "عائد الاستثمار مرتفع بسبب التدريب الجيد."]
  ]}
];

const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

const $ = (id) => document.getElementById(id);
const tabsEl = $("tabs"), gridEl = $("grid"), titleEl = $("secTitle"), qEl = $("q"), emptyEl = $("empty"), slowEl = $("slow");
let current = SECTIONS[0];

function countWord(n) { return n + (n <= 10 ? " كلمات" : " كلمة"); }
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

$("totalTerms").textContent = SECTIONS.reduce((a, s) => a + s.items.length, 0);

/* ---------- الصوت ---------- */
const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
let voices = [];
function loadVoices() { if (synth) voices = synth.getVoices(); }
if (synth) {
  loadVoices();
  if (synth.addEventListener) synth.addEventListener("voiceschanged", loadVoices);
} else {
  $("noTts").hidden = false;
}
function pickVoice() {
  const en = voices.filter(v => /^en([-_]|$)/i.test(v.lang));
  if (!en.length) return null;
  const score = (v) => {
    let s = 0;
    if (/^en[-_]US$/i.test(v.lang)) s += 4;
    if (/natural|neural|premium|enhanced/i.test(v.name)) s += 5;
    if (/google us english|samantha|aria|jenny|ava|allison|zira/i.test(v.name)) s += 3;
    if (v.localService) s += 1;
    return s;
  };
  return en.slice().sort((a, b) => score(b) - score(a))[0];
}
let activeBtn = null, timer = 0;
function speak(text, btn) {
  if (!synth) return;
  clearTimeout(timer);
  synth.cancel();
  if (activeBtn) activeBtn.classList.remove("playing");
  activeBtn = btn;
  timer = setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = slowEl.checked ? 0.6 : 0.9;
    btn.classList.add("playing");
    const done = () => btn.classList.remove("playing");
    u.onend = done; u.onerror = done;
    synth.speak(u);
  }, 60);
}

/* ---------- العرض ---------- */
function renderTabs() {
  tabsEl.innerHTML = SECTIONS.map(s => `
    <button class="tab" role="tab" id="tab-${s.id}" data-id="${s.id}" aria-selected="${s === current}" aria-controls="grid">
      <span class="n">القسم ${s.n}</span>
      <span class="en">${s.n}-${esc(s.en)}</span>
      <span class="ar">${s.ar}</span>
      <span class="c">${countWord(s.items.length)}</span>
    </button>`).join("");
}

function card(it, i) {
  const [en, ar, ex, exAr, say] = it;
  return `
  <li class="card">
    <div class="term">
      <span class="idx">${i + 1}</span>
      <div class="words">
        <span class="en" dir="ltr">${esc(en)}</span>
        <span class="ar"><small>المعنى</small>${esc(ar)}</span>
      </div>
      <button class="spk" type="button" data-say="${esc(say || en)}" aria-label="نطق: ${esc(en)}"${synth ? "" : " disabled"}>${ICON}</button>
    </div>
    <div class="ex">
      <div class="ex-txt">
        <span class="ex-lab">مثال</span>
        <span class="en" dir="ltr">${esc(ex)}</span>
        <span class="ar">${esc(exAr)}</span>
      </div>
      <button class="spk sm" type="button" data-say="${esc(ex)}" aria-label="نطق المثال: ${esc(ex)}"${synth ? "" : " disabled"}>${ICON}</button>
    </div>
  </li>`;
}

function renderGrid() {
  const q = qEl.value.trim().toLowerCase();
  const list = current.items
    .map((it, i) => ({ it, i }))
    .filter(({ it }) => !q || it.slice(0, 4).join(" ").toLowerCase().includes(q));
  gridEl.innerHTML = list.map(({ it, i }) => card(it, i)).join("");
  emptyEl.hidden = list.length > 0;
}

function select(id, pushHash) {
  current = SECTIONS.find(s => s.id === id) || SECTIONS[0];
  qEl.value = "";
  if (synth) synth.cancel();
  renderTabs();
  titleEl.innerHTML = `<span class="en" dir="ltr">${current.n}-${esc(current.en)}</span><span class="ar">${current.ar} · ${countWord(current.items.length)}</span>`;
  renderGrid();
  if (pushHash) { try { history.replaceState(null, "", "#" + current.id); } catch (e) {} }
}

tabsEl.addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (b) select(b.dataset.id, true);
});
gridEl.addEventListener("click", (e) => {
  const b = e.target.closest(".spk");
  if (b && !b.disabled) speak(b.dataset.say, b);
});
qEl.addEventListener("input", renderGrid);

select((location.hash || "").slice(1), false);
</script>
</body>
